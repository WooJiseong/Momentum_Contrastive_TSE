experiment:
  name: pn_indiv_mococo
  date: 20260802

train:
  batch_size: 2
  num_epochs: 300
  accumulation_steps: 4
  num_workers: 4
  precision: bf16-mixed
  log_dir: exp/20260802_indiv_mococo/stage0_moco
  log_interval: 20
  gradient_clip_val: 0.5

encoder:
  num_blocks: 3
  head_layers: 2
  binaural: false

contrastive:
  initial_pn_ckpt: ../../../checkpoints/proposed-monaural.pt
  strict_init: true
  train_encoder: true
  train_encoder_head: true
  temperature: 0.10
  ema_momentum: 0.997
  encoder_lr_scale: 0.03
  projection:
    in_ch: 64
    in_freq: 65
    hidden_dim: 2048
    emb_dim: 256
    nlayers: 3

augment:
  noise_std: 0.005

optim:
  lr: 1.0e-4
  weight_decay: 0.04

checkpoint:
  dir: exp/20260802_indiv_mococo/stage0_moco/checkpoints
  ckpt_name: indiv_moco_best
  save_best: 1
  save_last: true
  monitor: val_loss
  mode: min
  resume: null

ddp:
  num_gpus: 4
  find_unused_parameters: true

dataset:
  n_fft: 510
  win_length: 510
  hop_length: 128
  sample_rate: 16000
  segment: 3
  segment_aux: 3
  stft_scale: 1.0
  source_num: 3
  snr_db_range: [-3, 3]
  clean_enroll: false
  special_spk: [Partial_Pos, Partial_Neg]
  partial_range: [0.33, 0.66]
  neg_partial_range: [1.0, 1.0]
  active_num: [-1, 1, -1]
  train_roots: [LibriSpeech/train-clean-360, LibriSpeech/train-clean-100]
  val_root: LibriSpeech/dev-clean
  train_noise: wham_noise/tr
  val_noise: wham_noise/cv
  samples_per_epoch: 10000
  val_size: 200
