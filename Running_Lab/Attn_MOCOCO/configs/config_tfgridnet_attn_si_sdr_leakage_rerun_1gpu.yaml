# Single-GPU rerun of Attn_MOCOCO Stage1 SI-SDR + revised leakage loss.
# The 4-GPU DDP attempt is retained separately; this run avoids its NCCL hang.

base_config: ../PN_MOCOCO/configs/config_tfgridnet_supervised.yaml

experiment:
  name: attn_mococo_stage1_si_sdr_plus_leakage_rerun_1gpu
  date: 20260824

train:
  # Preserve the previous 4-GPU effective batch: 2 * 4 GPUs * 4 accumulation = 32.
  batch_size: 8
  accumulation_steps: 4
  num_epochs: 200
  num_workers: 4
  log_dir: exp/20260813_attn_mococo_40frame_lightweight_attention/stage1_tfgridnet_si_sdr_leakage_rerun_1gpu

checkpoint:
  dir: exp/20260813_attn_mococo_40frame_lightweight_attention/stage1_tfgridnet_si_sdr_leakage_rerun_1gpu/checkpoints
  ckpt_name: tfgridnet_si_sdr_leakage_rerun_1gpu_best
  resume: null

paths:
  initial_model_ckpt: ../../../checkpoints/proposed-monaural.pt
  encoder_override_ckpt: exp/20260813_attn_mococo_40frame_lightweight_attention/stage0_moco/checkpoints/pn_encoder_best.pt
  strict_initial_model: true
  strict_encoder_override: true

trainable:
  encoder: false
  encoder_head: false
  separator: true

ddp:
  use_ddp: false
  num_nodes: 1
  num_gpus: 1
  strategy: auto
  find_unused_parameters: false
  broadcast_buffers: false

eval:
  checkpoint: exp/20260813_attn_mococo_40frame_lightweight_attention/stage1_tfgridnet_si_sdr_leakage_rerun_1gpu/checkpoints/tfgridnet_si_sdr_leakage_rerun_1gpu_best.ckpt
  out_json: exp/20260813_attn_mococo_40frame_lightweight_attention/evaluation/si_sdr_leakage_rerun_1gpu_results.json

loss:
  type: si_sdr_plus_target_orthogonal_leakage
  orthogonal_leakage_weight: 0.1
  orthogonal_window_size: 2048
  orthogonal_hop_size: 1024
  orthogonal_gate_threshold: 0.1
  orthogonal_eps: 1.0e-8
  normalize_residual_energy: true
  activity_gate: true
  target_activity_threshold: 0.01
  nuisance_activity_threshold: 0.01
  verify_nuisance_contract: true
  fail_on_nonfinite: true
