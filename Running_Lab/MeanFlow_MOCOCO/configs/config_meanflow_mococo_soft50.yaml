# MeanFlow Stage1 conditioned by a trained MOCOCO Stage0 encoder.
# The default checkpoint is replaceable with --stage0-ckpt in the wrapper.

train:
  batch_size: 2
  num_epochs: 157
  accumulation_steps: 1
  num_workers: 4
  log_lr: true
  precision: bf16-mixed
  log_dir: exp/20260816_soft_mococo_meanflow_stage1/logs
  log_interval: 50
  detect_anomaly: false
  gradient_clip_val: 0.5
  limit_train_batches: null
  limit_val_batches: null
  overfit_batches: 0.0

scheduler:
  type: CosineAnnealingLR
  t_max: 157
  eta_min: 1.0e-5
  warmup_epochs: 2
  lr_reduce_patience: 20
  lr_reduce_factor: 0.5
  start_epoch: 0

loss:
  gamma: 0.5
  endpoint_aux:
    enabled: false
    sisdr_weight: 0.0
    mrstft_weight: 0.0
    leak_weight: 0.0

solver:
  step_size: 1.0
  test_step_size: 1.0
  method: euler

meanflow:
  flow_ratio: 1.0
  alpha_schedule_start_epoch: 0
  alpha_schedule_end_epoch: null
  alpha_gamma: 25.0
  alpha_min: 0.005

validation:
  sample_steps: 16
  nfe_list: [1]

model:
  input_dim: 512
  output_dim: 512
  pos_method: none
  pos_length: 500
  hidden_size: 512
  depth: 8
  num_heads: 8
  cond_mode: cross_attn
  cond_dim: 512

dataset:
  n_fft: 510
  win_length: 510
  hop_length: 128
  sample_rate: 16000
  segment: 3
  segment_aux: 3
  stft_scale: 1.0
  source_num: 3
  snr_db_range: [-3, 3]
  clean_enroll: false
  special_spk: [Partial_Pos, Partial_Neg]
  partial_range: [0.33, 0.66]
  neg_partial_range: [1.0, 1.0]
  active_num: [-1, 1, -1]
  train_roots:
    - /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/LibriSpeech/train-clean-360
    - /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/LibriSpeech/train-clean-100
  val_root: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/LibriSpeech/dev-clean
  test_root: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/LibriSpeech/test-clean
  train_noise: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/wham_noise/tr
  val_noise: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/wham_noise/cv
  test_noise: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/data/wham_noise/tt
  samples_per_epoch: 30000
  val_size: 200

enroll:
  provider: v2b_pn_encoder
  time: full
  cond_mode: cross_attn
  v2b_use_pos_emb: true
  pn_ckpt: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/contrastive_momentum/Running_Lab/Soft_MOCOCO/exp/20260803_stage0_50ep_soft_wo_leakage_test/stage0_moco/checkpoints/pn_encoder_50ep.pt
  t_predicter_ckpt: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/checkpoints/t_predicter_best.ckpt

paths:
  pn_ckpt: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/contrastive_momentum/Running_Lab/Soft_MOCOCO/exp/20260803_stage0_50ep_soft_wo_leakage_test/stage0_moco/checkpoints/pn_encoder_50ep.pt
  t_predicter_ckpt: /gpfs/home1/wjs6800/SIALab/PNFlowTSE/checkpoints/t_predicter_best.ckpt

optim:
  optimizer: AdamW
  lr: 5.0e-5
  weight_decay: 0.01

ddp:
  use_ddp: true
  num_nodes: 1
  num_gpus: 4
  strategy: ddp

seed: 42

early_stopping:
  enabled: false
  monitor: val_loss
  patience: 50
  verbose: true
  mode: min
  delta: 0.0

checkpoint:
  dir: exp/20260816_soft_mococo_meanflow_stage1/checkpoints
  ckpt_name: meanflow_mococo_stage1_best
  save_best: true
  save_last: true
  verbose: true
  monitor: val_loss
  mode: min
  load_weights_only: false
  resume: null
  periodic:
    enabled: true
    save_every_n_epochs: 50
    verbose: true

eval:
  checkpoint: exp/20260816_soft_mococo_meanflow_stage1/checkpoints/meanflow_mococo_stage1_best.ckpt
  test_n: 5000

t_predicter:
  C: 1024

mr_jitter:
  enabled: true
  sigma: 0.25
