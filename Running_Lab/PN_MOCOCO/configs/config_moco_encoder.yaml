# PN_MOCOCO stage 0: task-aware momentum contrastive pretraining for the original PN encoder.

experiment:
  name: pn_mococo
  date: 20260729

train:
  batch_size: 2
  num_epochs: 300
  accumulation_steps: 4
  num_workers: 4
  log_lr: true
  precision: bf16-mixed
  log_dir: exp/moco_encoder
  log_interval: 20
  detect_anomaly: false
  gradient_clip_val: 0.5
  limit_train_batches: null
  limit_val_batches: null

scheduler:
  type: CosineAnnealingLR
  t_max: 300
  eta_min: 1.0e-06
  warmup_epochs: 15

encoder:
  num_blocks: 3
  head_layers: 2
  binaural: false

contrastive:
  initial_pn_ckpt: ../../../checkpoints/proposed-monaural.pt
  strict_init: true
  train_encoder: true
  train_encoder_head: true
  encoder_lr_scale: 0.03
  positive_key: source
  temperature: 0.10
  ema_momentum_base: 0.997
  ema_momentum_final: 1.0
  use_queue: true
  queue_size: 4096
  use_inbatch_positive_as_negative: false
  use_background_negative: false
  query_strong_aug: true
  key_strong_aug: false
  projection:
    in_ch: 64
    in_freq: 65
    hidden_dim: 2048
    emb_dim: 256
    nlayers: 3
    use_bn: false

augment:
  gain_range: [0.80, 1.25]
  noise_std_weak: 0.00
  noise_std_strong: 0.005
  mask_prob_weak: 0.10
  mask_prob_strong: 0.25
  mask_max_ratio: 0.15
  shift_max_ratio: 0.01

dataset:
  n_fft: 510
  win_length: 510
  hop_length: 128
  sample_rate: 16000
  segment: 3
  segment_aux: 3
  stft_scale: 1.0
  source_num: 3
  snr_db_range: [-3, 3]
  clean_enroll: false
  special_spk: ["Partial_Pos", "Partial_Neg"]
  partial_range: [0.33, 0.66]
  neg_partial_range: [1.0, 1.0]
  active_num: [-1, 1, -1]
  train_roots:
    - LibriSpeech/train-clean-360
    - LibriSpeech/train-clean-100
  val_root: LibriSpeech/dev-clean
  test_root: LibriSpeech/test-clean
  train_noise: wham_noise/tr
  val_noise: wham_noise/cv
  test_noise: wham_noise/tt
  samples_per_epoch: 10000
  val_size: 200

enroll:
  provider: v2b_pn_encoder
  time: full
  v2b_use_pos_emb: true

optim:
  optimizer: AdamW
  lr: 1.0e-04
  weight_decay: 0.04

ddp:
  use_ddp: true
  num_nodes: 1
  num_gpus: 4
  strategy: ddp
  find_unused_parameters: false
  broadcast_buffers: false

seed: 42

early_stopping:
  enabled: false
  monitor: val_loss
  patience: 20
  verbose: true
  mode: min
  delta: 0.0

checkpoint:
  dir: exp/moco_encoder/checkpoints
  ckpt_name: moco_best
  save_best: 1
  save_last: true
  verbose: true
  monitor: val_loss
  mode: min
  resume: null
